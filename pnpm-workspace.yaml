packages:
  - "apps/*"
  - "packages/*"
  - "docs"

injectWorkspacePackages: true

minimumReleaseAge: 0

allowBuilds:
  "@hatchet-dev/typescript-sdk": true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: false
  workerd: false

catalog:
  "@hatchet-dev/typescript-sdk": ^1.19.1
  "@hono/zod-validator": ^0.9.1
  "@inlang/paraglide-js": ^2.16.0
  "@inlang/plugin-message-format": ^4.4.0
  "@loglayer/hono": ^2.4.0
  "@loglayer/transport-pino": ^3.3.0
  "@oxlint/plugins": 1.82.0
  "@types/node": ^24.12.2
  better-all: ^0.0.7
  dayjs: ^1.11.19
  dotenv: ^17.4.2
  drizzle-kit: 1.0.0-beta.20
  drizzle-orm: 1.0.0-beta.20
  envalid: ^8.1.1
  hono: ^4.12.14
  ical.js: ^2.2.1
  lru-cache: ^11.3.5
  loglayer: ^9.4.0
  npm-run-all2: ^8.0.4
  oxc-minify: ^0.124.0
  oxlint: 1.82.0
  pino: ^10.1.1
  pino-pretty: ^13.1.3
  temporal-polyfill: 0.3.0
  tsx: ^4.21.0
  typescript: ^5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  vitepress: 2.0.0-alpha.17
  wrangler: ^4.152.0
  zod: ^4.5.4
  "@hono/node-server": ^2.1.5
  sonner: ^2.0.8
  react-day-picker: ^10.0.2
  date-fns: ^4.4.0

catalogMode: prefer

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

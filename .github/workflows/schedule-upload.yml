name: "[schedule-parser] Parse schedule and upload to R2"

on:
  workflow_dispatch:
    inputs:
      duToken:
        required: true
        description: "DU auth bearer token"
        type: string

permissions:
  actions: write

jobs:
  parse-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          working-directory: tools/schedule-parser
          cache: true
          require-lockfile: true

      - name: Extract groups from PDFs
        working-directory: tools/schedule-parser
        run: pnpm groups

      - name: Fetch group schedules
        working-directory: tools/schedule-parser
        run: pnpm schedule
        env:
          DU_TOKEN: ${{ inputs.duToken }}

      - name: List generated files
        run: find tools/schedule-parser/output -maxdepth 2 -type f -print

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Upload to R2 bucket
        run: rclone sync ./tools/schedule-parser/output remoodle:calendar-schedule -v

      - name: Trigger cabgen workflow
        run: gh workflow run cabgen-upload.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
